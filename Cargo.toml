[package]
# Port of Create Crafts & Additions 1.7.2 (MRH0/createaddition, commit
# 658a390b8ff4daa17013e9447b29949330c8a42a, MIT), the ATM10 jar
# createaddition-1.7.2.jar. Minecraft Java 1.21.1 NeoForge; the port targets
# Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md); local-only
# until publishing is approved, publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "createaddition"
version = "0.2.15"
edition = "2024"
license = "MIT"
description = "Create Crafts & Additions for Horizon: an FE connector/wire/accumulator network, the accumulator multiblock and its comparator output, the redstone relay, the small light connector, the creative generator, the festive/iron wire items, the wires a broken connector drops, the blocks the level removes when their support is broken, the block/chunk/level clears of the accumulator's comparator answers, and the client half: wires drawn on the jar's catenary and shaded by the jar's lightmap, the held spool's wire previewed from the selected node to the player, and the accumulator's gauge needle swung by its fill"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). No other dependency: the pure runtime
# needs nothing, and a registry crate would have to be pinned with
# `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
